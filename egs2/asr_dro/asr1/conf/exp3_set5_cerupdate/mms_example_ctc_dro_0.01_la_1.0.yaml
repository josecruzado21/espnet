accum_grad: 16
batch_size: 4
batch_type: sorted
best_model_criterion:
- - valid
  - loss
  - min
ctc_conf:
  accumulation: true
  agg: sum
  ctc_type: droctc
  dro_group_count: 6
  dro_q_epsilon: 1.0e-10
  dro_step_size: 0.01
  normalize_grad: true
  smoothing: 1.0
decoder: none
encoder: transformer
encoder_conf:
  attention_dropout_rate: 0.1
  attention_heads: 8
  dropout_rate: 0.1
  input_layer: conv2d2
  linear_units: 1024
  normalize_before: true
  num_blocks: 2
  output_size: 256
  positional_dropout_rate: 0.1
frontend: s3prl
frontend_conf:
  download_dir: ./hub
  frontend_conf:
    path_or_url: facebook/mms-300m
    upstream: hf_wav2vec2_custom
  multilayer_feature: true
init: xavier_uniform
keep_nbest_models: 2
max_epoch: 40
model_conf:
  ctc_weight: 1.0
num_iters_per_epoch: 1200
num_workers: 4
optim: adam
optim_conf:
  lr: 0.0001
  weight_decay: 1.0e-06
patience: none
preencoder: linear
preencoder_conf:
  input_size: 1024
  output_size: 80
specaug: specaug
specaug_conf:
  apply_freq_mask: true
  apply_time_mask: true
  apply_time_warp: true
  freq_mask_width_range:
  - 0
  - 27
  num_freq_mask: 2
  num_time_mask: 10
  time_mask_width_ratio_range:
  - 0.0
  - 0.05
  time_warp_mode: bicubic
  time_warp_window: 5
unused_parameters: true
